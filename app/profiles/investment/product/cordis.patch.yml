# AI Trading Automation 2.0 — headless profile patch layer.
#
# One-shot task mode used by the Python engine scheduler to run autonomous
# investment rounds (P3). No web server; the runner prints the final answer.
# This file is seeded into $DSH_HOME/profiles/investment/ by app/scripts/seed.ps1.
#
# Agent plane note: the headless runner creates its agent through the core
# registry WITHOUT a preset caller (agent presets are mounted by the web
# session-creation flow), so this profile composes the agent at the HOST
# plane: the investment persona below, the host-plane investment-tools bridge
# row, and the base's skills/web/goals/subagents/workflows/todo/compaction
# rows (kept). The desktop chat uses the same investment_* tool set through
# the investment preset — the only intended differences are plan mode and
# ask_user (interactive surface), which autonomous rounds must not have.

# Deployment persona (the headless runner agent is host-plane composed).
- id: system-prompt
  config:
    personaPrefix: >-
      You are AI Trading Automation 2.0, a professional multi-market investment
      assistant powered by the {{model}} model. Your working directory is
      {{cwd}}. You execute one bounded autonomous investment round for
      A股/港股/美股/ETF: read the engine state, then run the FIXED analysis
      workflow through investment_analysis_workflow — never re-implement the
      multi-role analysis yourself with raw market/news tools, and never
      submit decisions outside the workflow's output. The engine's fills and
      rejections are the only facts — never invent trades the engine did not
      report. Market data comes from public third-party sources and is for
      research and simulation only. Call investment_analysis_workflow exactly
      once for the assigned cycle. If it fails, report the persisted error and
      stop; completed checkpoints remain available for an explicit user retry.
      Background research must not edit source, run shell commands, repair the
      application, spawn an alternative workflow, change cycle IDs or retry the
      research. Product maintenance is handled separately in the user's chat.

# Keep telemetry off for this product regardless of environment.
- id: session-telemetry-otel
  config:
    mode: DISABLED
    shutdownTimeoutMillis: 3000
    exporter:
      url: !!js process.env.DSH_TELEMETRY_OTLP_URL ?? 'https://harness-telemetry.deepseeksvc.com/v1/logs'
      compression: gzip
      timeoutMillis: 1000
    processor:
      scheduledDelayMillis: 10000
      maxQueueSize: 2048
      maxExportBatchSize: 2048
      exportTimeoutMillis: 1500

# ── investment engine bridge (host plane) ──────────────────────────────────
- insert:
    - id: investment-tools
      name: '@ai-trading-automation/dsh-investment-tools'
      config:
        engineUrl: 'http://127.0.0.1:8790'

# ── fixed analysis workflow (host plane, SAME implementation as web) ───────
#
# The headless runner composes its agent at the host plane (no preset), so
# the fixed workflow must be mounted HERE for autonomous rounds to see
# investment_analysis_workflow. The tool's headless mode runs the multi-stage
# pipeline synchronously (ATA_AUTONOMOUS_ROUND=1) and posts checkpoints into
# runtime/analysis_runs through the engine API. The web preset mounts the
# same package; in manual sessions the same tool is the async launcher.
- insert:
    - id: investment-analysis-workflow
      name: '@ai-trading-automation/dsh-investment-workflow'
      config:
        engineUrl: 'http://127.0.0.1:8790'
        lightweightResults: true
        sharedResearch: true
        singleConversationBaseResearch: false
        # Independent pilot switches; validate real-data quality before rollout.
        researchPolicy: 'off'
        researchRoles: false
        deduplicateResearch: false
        strictEvidence: false
        uniformOutput: false

# ── autonomous-round agent surface ─────────────────────────────────────────
#
# The coordinator executes one fixed workflow. Its runtime tool guard blocks
# coding and alternative workflows; research children retain their tools.

# Autonomous rounds execute an already-approved cycle; plan mode would gate
# every submission behind an approval channel that has no user attached.
- id: plan-mode
  disabled: true

# Retain native search settings and provider identity; record actual usage.
- id: web-search-deepseek
  disabled: true
- insert:
    - id: investment-research-search
      name: '@ai-trading-automation/dsh-investment-tools/lib/research-search.js'
      config:
        apiKeyEnv: DEEPSEEK_API_KEY
