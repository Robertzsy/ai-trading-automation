[project]
name = "ai-trading-automation"
version = "2.2.0"  # keep in sync with engine/version.py
description = "Multi-market paper-trading investment automation with multi-agent research and portfolio optimization"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "AI Trading Automation Contributors"}]
dependencies = [
  "requests>=2.32.0",
  "PyYAML>=6.0.2",
  "APScheduler>=3.10.4",
  "openai>=1.40.0",
  "python-dotenv>=1.0.1",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "pydantic-ai-slim[openai]>=2.0,<3",
  "pymongo>=4.8,<5",
  "akshare==1.19.1; python_version >= '3.11'",
  "baostock==0.9.4",
]

[project.scripts]
ai-trading-automation = "engine.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
