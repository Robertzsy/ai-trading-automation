   <g id="text_1">
    <text style="fill: #172b46; font: 700 22px 'Microsoft YaHei'; text-anchor: start" x="34.56" y="56.744687" transform="rotate(-0 34.56 56.744687)">Quant + AI: from candidates to constrained paper execution</text>
   </g>
   <g id="text_2">
    <text style="fill: #586b83; font: 11.5px 'Microsoft YaHei'; text-anchor: start" x="34.56" y="82.632812" transform="rotate(-0 34.56 82.632812)">Method diagram · Based on the current implementation · Recorded cases shown separately</text>
   </g>
   <g id="text_3">
    <text style="fill: #2563eb; font: 700 13.5px 'Microsoft YaHei'; text-anchor: start" x="48.96" y="141.785156" transform="rotate(-0 48.96 141.785156)">01  Quantitative screening</text>
   </g>
   <g id="text_4">
    <text style="fill: #172b46; font: 10.6px 'Microsoft YaHei'" transform="translate(48.96 166.873375)">55% potential + 45% base score</text>
    <text style="fill: #172b46; font: 10.6px 'Microsoft YaHei'" transform="translate(48.96 185.607881)">9 factors in the base score</text>
    <text style="fill: #172b46; font: 10.6px 'Microsoft YaHei'" transform="translate(48.96 204.342388)">Default shortlist: 8 candidates</text>
   </g>
   <g id="text_5">
    <text style="fill: #2563eb; font: 700 13.5px 'Microsoft YaHei'; text-anchor: start" x="347.04" y="141.831563" transform="rotate(-0 347.04 141.831563)">02  AI stock research</text>
   </g>
   <g id="text_6">
    <text style="fill: #172b46; font: 10.6px 'Microsoft YaHei'" transform="translate(347.04 166.873375)">Technical / financial / news / sentiment</text>
    <text style="fill: #172b46; font: 10.6px 'Microsoft YaHei'" transform="translate(347.04 185.607881)">Bull–bear debate and adjudication</text>
    <text style="fill: #172b46; font: 10.6px 'Microsoft YaHei'" transform="translate(347.04 204.403669)">Actions, evidence and scenario assumptions</text>
   </g>
   <g id="text_7">
    <text style="fill: #2563eb; font: 700 13.5px 'Microsoft YaHei'; text-anchor: start" x="645.12" y="141.831563" transform="rotate(-0 645.12 141.831563)">03  Portfolio and cash rules</text>
   </g>
   <g id="text_8">
    <text style="fill: #172b46; font: 10.6px 'Microsoft YaHei'" transform="translate(645.12 166.873375)">Portfolio draft and risk debate</text>
    <text style="fill: #172b46; font: 10.6px 'Microsoft YaHei'" transform="translate(645.12 185.607881)">Cash rules post-process proposals</text>
    <text style="fill: #172b46; font: 10.6px 'Microsoft YaHei'" transform="translate(645.12 204.342388)">BUY / SELL / HOLD / WATCH</text>
   </g>
   <g id="text_9">
    <text style="fill: #2563eb; font: 700 13.5px 'Microsoft YaHei'; text-anchor: start" x="645.12" y="293.031563" transform="rotate(-0 645.12 293.031563)">04  Python risk checks</text>
   </g>
   <g id="text_10">
    <text style="fill: #172b46; font: 10.6px 'Microsoft YaHei'" transform="translate(645.12 318.073375)">Strategy mandate and market settings</text>
    <text style="fill: #172b46; font: 10.6px 'Microsoft YaHei'" transform="translate(645.12 336.869163)">Position, cash and confidence limits</text>
    <text style="fill: #172b46; font: 10.6px 'Microsoft YaHei'" transform="translate(645.12 355.603669)">Constrain or reject proposed orders</text>
   </g>
   <g id="text_11">
    <text style="fill: #2563eb; font: 700 13.5px 'Microsoft YaHei'; text-anchor: start" x="347.04" y="293.031563" transform="rotate(-0 347.04 293.031563)">05  Paper broker</text>
   </g>
   <g id="text_12">
    <text style="fill: #172b46; font: 10.6px 'Microsoft YaHei'" transform="translate(347.04 318.197594)">Reference quotes fetched by the engine</text>
    <text style="fill: #172b46; font: 10.6px 'Microsoft YaHei'" transform="translate(347.04 336.993381)">Commission, taxes and slippage</text>
    <text style="fill: #172b46; font: 10.6px 'Microsoft YaHei'" transform="translate(347.04 355.789169)">Manual submissions require approval</text>
   </g>
   <g id="text_13">
    <text style="fill: #2563eb; font: 700 13.5px 'Microsoft YaHei'; text-anchor: start" x="48.96" y="293.031563" transform="rotate(-0 48.96 293.031563)">06  Reports and receipts</text>
   </g>
   <g id="text_14">
    <text style="fill: #172b46; font: 10.6px 'Microsoft YaHei'" transform="translate(48.96 318.073375)">Archived evidence, gaps and decisions</text>
    <text style="fill: #172b46; font: 10.6px 'Microsoft YaHei'" transform="translate(48.96 337.105178)">Paper fills and rejection reasons</text>
    <text style="fill: #172b46; font: 10.6px 'Microsoft YaHei'" transform="translate(48.96 355.900966)">Records for review and evaluation</text>
   </g>
   <g id="text_15">
    <text style="fill: #2563eb; font: 700 13px 'Microsoft YaHei'; text-anchor: start" x="50.4" y="446.876406" transform="rotate(-0 50.4 446.876406)">Independent allocation reference: mean–variance / Black–Litterman / risk parity / cost adjustment</text>
   </g>
   <g id="text_16">
    <text style="fill: #172b46; font: 11px 'Microsoft YaHei'; text-anchor: start" x="50.4" y="476.202031" transform="rotate(-0 50.4 476.202031)">The assistant retrieves weights, historical risk and cost comparisons. The fixed workflow does not automatically adopt them.</text>
   </g>
   <g id="text_17">
    <text style="fill: #586b83; font: 11px 'Microsoft YaHei'; text-anchor: start" x="34.56" y="541.002031" transform="rotate(-0 34.56 541.002031)">WATCH is a research state, without automatic price-triggered orders. A BUY proposal is not a filled position.</text>
   </g>
  </g>
 </g>
