   <g id="text_1">
    <text style="fill: #172b46; font: 700 22px 'Microsoft YaHei'; text-anchor: start" x="34.56" y="56.46625" transform="rotate(-0 34.56 56.46625)">量化与 AI：从候选到受约束的模拟执行</text>
   </g>
   <g id="text_2">
    <text style="fill: #586b83; font: 11.5px 'Microsoft YaHei'; text-anchor: start" x="34.56" y="82.632812" transform="rotate(-0 34.56 82.632812)">方法示意 · 按当前源码整理 · 实际运行案例见后文</text>
   </g>
   <g id="text_3">
    <text style="fill: #2563eb; font: 700 14.5px 'Microsoft YaHei'; text-anchor: start" x="50.4" y="142.630938" transform="rotate(-0 50.4 142.630938)">01  量化候选</text>
   </g>
   <g id="text_4">
    <text style="fill: #172b46; font: 12px 'Microsoft YaHei'" transform="translate(50.4 167.9925)">进攻潜力分 55% + 基础分 45%</text>
    <text style="fill: #172b46; font: 12px 'Microsoft YaHei'" transform="translate(50.4 188.242125)">9 因子共同形成基础评分</text>
    <text style="fill: #172b46; font: 12px 'Microsoft YaHei'" transform="translate(50.4 208.49175)">默认 8 只候选，保留因子依据</text>
   </g>
   <g id="text_5">
    <text style="fill: #2563eb; font: 700 14.5px 'Microsoft YaHei'; text-anchor: start" x="348.48" y="142.630938" transform="rotate(-0 348.48 142.630938)">02  AI 个股研究</text>
   </g>
   <g id="text_6">
    <text style="fill: #172b46; font: 12px 'Microsoft YaHei'" transform="translate(348.48 167.9925)">技术 / 基本面 / 新闻 / 情绪</text>
    <text style="fill: #172b46; font: 12px 'Microsoft YaHei'" transform="translate(348.48 188.242125)">多空辩论与研究裁决</text>
    <text style="fill: #172b46; font: 12px 'Microsoft YaHei'" transform="translate(348.48 208.49175)">输出动作、证据与情景假设</text>
   </g>
   <g id="text_7">
    <text style="fill: #2563eb; font: 700 14.5px 'Microsoft YaHei'; text-anchor: start" x="646.56" y="142.630938" transform="rotate(-0 646.56 142.630938)">03  组合与现金配置</text>
   </g>
   <g id="text_8">
    <text style="fill: #172b46; font: 12px 'Microsoft YaHei'" transform="translate(646.56 167.9925)">组合草案 + 三方风险辩论</text>
    <text style="fill: #172b46; font: 12px 'Microsoft YaHei'" transform="translate(646.56 188.242125)">现金规则对建议进行后处理</text>
    <text style="fill: #172b46; font: 12px 'Microsoft YaHei'" transform="translate(646.56 208.49175)">BUY / SELL / HOLD / WATCH</text>
   </g>
   <g id="text_9">
    <text style="fill: #2563eb; font: 700 14.5px 'Microsoft YaHei'; text-anchor: start" x="646.56" y="294.268203" transform="rotate(-0 646.56 294.268203)">04  Python 硬风控</text>
   </g>
   <g id="text_10">
    <text style="fill: #172b46; font: 12px 'Microsoft YaHei'" transform="translate(646.56 319.1925)">策略授权书 + 市场规则</text>
    <text style="fill: #172b46; font: 12px 'Microsoft YaHei'" transform="translate(646.56 339.442125)">检查仓位、现金、置信度等</text>
    <text style="fill: #172b46; font: 12px 'Microsoft YaHei'" transform="translate(646.56 359.69175)">限制或拒绝拟执行订单</text>
   </g>
   <g id="text_11">
    <text style="fill: #2563eb; font: 700 14.5px 'Microsoft YaHei'; text-anchor: start" x="348.48" y="293.830938" transform="rotate(-0 348.48 293.830938)">05  模拟撮合</text>
   </g>
   <g id="text_12">
    <text style="fill: #172b46; font: 12px 'Microsoft YaHei'" transform="translate(348.48 319.1925)">引擎获取参考行情</text>
    <text style="fill: #172b46; font: 12px 'Microsoft YaHei'" transform="translate(348.48 339.442125)">计入佣金、税费与滑点</text>
    <text style="fill: #172b46; font: 12px 'Microsoft YaHei'" transform="translate(348.48 359.69175)">手动研究需批准后提交</text>
   </g>
   <g id="text_13">
    <text style="fill: #2563eb; font: 700 14.5px 'Microsoft YaHei'; text-anchor: start" x="50.4" y="293.830938" transform="rotate(-0 50.4 293.830938)">06  报告与执行记录</text>
   </g>
   <g id="text_14">
    <text style="fill: #172b46; font: 12px 'Microsoft YaHei'" transform="translate(50.4 319.1925)">阶段证据、缺口与决策归档</text>
    <text style="fill: #172b46; font: 12px 'Microsoft YaHei'" transform="translate(50.4 339.442125)">记录模拟成交及拒绝原因</text>
    <text style="fill: #172b46; font: 12px 'Microsoft YaHei'" transform="translate(50.4 359.69175)">支持后续复查与评估</text>
   </g>
   <g id="text_15">
    <text style="fill: #2563eb; font: 700 14px 'Microsoft YaHei'; text-anchor: start" x="50.4" y="447.51125" transform="rotate(-0 50.4 447.51125)">独立配置参考：均值—方差 / Black–Litterman / 风险平价 / 成本调整</text>
   </g>
   <g id="text_16">
    <text style="fill: #172b46; font: 11.5px 'Microsoft YaHei'; text-anchor: start" x="50.4" y="476.472813" transform="rotate(-0 50.4 476.472813)">优化器提供权重、历史风险与调仓成本对照，由助手读取解读；固定研究流程不会自动采用其权重。</text>
   </g>
   <g id="text_17">
    <text style="fill: #586b83; font: 11.5px 'Microsoft YaHei'; text-anchor: start" x="34.56" y="541.272812" transform="rotate(-0 34.56 541.272812)">WATCH 当前为研究状态，不会触价自动下单。BUY 建议也不等于已成交仓位。</text>
   </g>
  </g>
 </g>
